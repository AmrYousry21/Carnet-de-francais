<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de français</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 15-minute-a-day French course with spaced repetition, grammar, listening and speaking. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Playwrite+FR+Moderne&display=swap">
<style>
/* Layout: one centred column (max 760px). Study surfaces are Seyès-ruled notebook pages
   (the grid every French schoolchild writes on) with a red margin; everything else is a quiet blue-grey desk. */
:root{
  --bg:#eceff7; --surface:#ffffff; --paper:#fdfdff; --fg:#1b2132; --muted:#586080; --border:#d3d9ea;
  --ink:#1f3592; --accent:#2a45c2; --on-accent:#ffffff; --accent-soft:#e2e7fb;
  --red:#d6404c; --line:rgba(52,92,210,.11); --line-strong:rgba(52,92,210,.26);
  --good:#17784d; --good-soft:#dcf1e5; --warn:#94600f; --warn-soft:#f7ebd3; --bad:#b9313d; --bad-soft:#f9e1e3;
  --heat0:#e1e5f0; --heat1:#c3cdf2; --heat2:#8fa1e6; --heat3:#5670d6; --heat4:#2a45c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Playwrite FR Moderne","Segoe Script","Brush Script MT",cursive;
  --r:12px; --margin:44px;
  --shadow:0 1px 0 rgba(20,30,80,.04),0 10px 30px -18px rgba(20,30,80,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1120; --surface:#141a2d; --paper:#151c31; --fg:#e6e9f5; --muted:#9aa3c3; --border:#29314e;
    --ink:#b3c1ff; --accent:#7f95ff; --on-accent:#0d1120; --accent-soft:#1e2748;
    --red:#ff6f7b; --line:rgba(140,165,255,.07); --line-strong:rgba(140,165,255,.16);
    --good:#56c993; --good-soft:#14362a; --warn:#e8b65a; --warn-soft:#3a2d14; --bad:#ff7b86; --bad-soft:#3d1a21;
    --heat0:#1a2038; --heat1:#25335f; --heat2:#34498c; --heat3:#5068c4; --heat4:#7f95ff;
    --shadow:0 10px 30px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1120; --surface:#141a2d; --paper:#151c31; --fg:#e6e9f5; --muted:#9aa3c3; --border:#29314e;
  --ink:#b3c1ff; --accent:#7f95ff; --on-accent:#0d1120; --accent-soft:#1e2748;
  --red:#ff6f7b; --line:rgba(140,165,255,.07); --line-strong:rgba(140,165,255,.16);
  --good:#56c993; --good-soft:#14362a; --warn:#e8b65a; --warn-soft:#3a2d14; --bad:#ff7b86; --bad-soft:#3d1a21;
  --heat0:#1a2038; --heat1:#25335f; --heat2:#34498c; --heat3:#5068c4; --heat4:#7f95ff;
  --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:14px 56px; -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
.wrap{max-width:760px; margin:0 auto}
h1,h2,h3{font-family:var(--f-display); font-weight:700; line-height:1.15; text-wrap:balance; margin:0; color:var(--fg)}
h1{font-size:clamp(28px,5vw,38px); letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
a{color:var(--accent)}
small{font-size:.8em}
.muted{color:var(--muted)}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.num, .tab-num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ---------- header ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin-bottom:22px}
.brand{display:flex; align-items:baseline; gap:8px; text-decoration:none; color:var(--ink)}
.brand .mark{font-family:var(--f-hand); font-size:24px; line-height:1.6}
.brand .sub{font-family:var(--f-display); font-weight:500; font-size:15px; color:var(--muted)}
.tabs{display:flex; gap:2px; overflow-x:auto; max-width:100%; scrollbar-width:none}
.tabs a{padding:7px 11px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:700; font-size:14px; white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--accent-soft); color:var(--ink)}

/* ---------- surfaces ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; box-shadow:var(--shadow); min-width:0}
.seyes{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent calc(var(--margin) - 1px), var(--red) calc(var(--margin) - 1px), var(--red) calc(var(--margin) + 1px), transparent calc(var(--margin) + 1px)),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(180deg, var(--line-strong) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(180deg, var(--line) 0 1px, transparent 1px 8px);
  background-position:0 0, var(--margin) 0, 0 15px, 0 15px;
  padding-left:calc(var(--margin) + 20px);
}
.meta{display:flex; justify-content:space-between; gap:12px; font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:18px}
.lbl{font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.03em}
.fr{color:var(--ink); font-weight:700}
.xl{font-size:clamp(28px,6vw,40px); line-height:1.2; margin:6px 0 10px; overflow-wrap:anywhere}
.lg{font-size:21px; line-height:1.35}
.en{color:var(--fg)}
.note{color:var(--muted); font-size:15px; margin-top:4px}
.tip{color:var(--muted); font-size:14px; margin-top:16px; font-style:italic}

/* ---------- buttons ---------- */
.btn{font:700 15px/1 var(--f-body); border:1px solid var(--border); background:var(--surface); color:var(--fg); padding:12px 16px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; transition:transform .08s ease, background .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--fg); border-color:var(--border)}
.btn.big{padding:16px 22px; font-size:17px}
.btn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.btn:disabled{opacity:.55; cursor:default}
.say{width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--accent); display:inline-grid; place-items:center; cursor:pointer; flex:none; vertical-align:middle}
.say:hover{border-color:var(--accent); background:var(--accent-soft)}
.say.sm{width:34px; height:34px}
.say.rec{background:var(--bad-soft); color:var(--bad); border-color:var(--bad); animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--bad-soft)}}
.ctr{margin-top:22px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ctr.end{justify-content:space-between}

/* ---------- today ---------- */
.date{font-family:var(--f-hand); font-size:clamp(20px,4vw,26px); color:var(--ink); line-height:1.8; display:inline-block; border-bottom:2px solid var(--red); padding-bottom:2px; margin-bottom:10px}
.hero p.lead{color:var(--muted); margin-top:6px; max-width:60ch}
.plan{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.plan li{display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:baseline; padding:12px 0; border-bottom:1px dashed var(--line-strong)}
.plan li:last-child{border-bottom:0}
.plan .n{font-family:var(--f-hand); color:var(--red); font-size:18px}
.plan .t{font-weight:700}
.plan .d{color:var(--muted); font-size:14px; display:block; font-weight:400}
.plan .m{font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; white-space:nowrap}
.status{display:flex; gap:10px 18px; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.status b{color:var(--fg)}
.roadmap ol{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px}
.roadmap li{display:grid; grid-template-columns:40px 1fr; gap:14px; padding:14px 16px; border:1px solid var(--border); border-radius:var(--r); background:var(--surface)}
.roadmap li.now{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.roadmap li.later{opacity:.75}
.ph-num{font-family:var(--f-display); font-weight:700; font-size:26px; color:var(--ink); line-height:1}
.ph-name{font-weight:700}
.ph-en{color:var(--muted); font-size:14px}
.ph-stat{color:var(--muted); font-size:13px; margin-top:6px; font-variant-numeric:tabular-nums}
.pbar{height:6px; background:var(--heat0); border-radius:99px; overflow:hidden; margin-top:8px}
.pbar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.tipbox{border-left:3px solid var(--red); padding:4px 0 4px 14px; color:var(--muted); font-size:15px}
.tipbox b{color:var(--fg)}

/* ---------- session ---------- */
.sess-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.chips{list-style:none; margin:0; padding:0; display:flex; gap:6px; flex-wrap:wrap}
.chips li{font-size:13px; font-weight:700; padding:6px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); background:var(--surface); white-space:nowrap}
.chips li small{font-weight:400; margin-left:4px}
.chips li.now{border-color:var(--accent); color:var(--ink); background:var(--accent-soft)}
.chips li.past{color:var(--good); border-color:transparent; background:transparent}
.chips li.skip{text-decoration:line-through; opacity:.6}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; color:var(--fg)}
.timer small{color:var(--muted); font-weight:400}
.tbar{height:4px; background:var(--heat0); border-radius:99px; overflow:hidden; margin-bottom:18px}
.tbar i{display:block; height:100%; width:0; background:var(--red); transition:width 1s linear}
.study{min-height:260px}
.ans{margin-top:16px; padding-top:16px; border-top:2px solid var(--line-strong)}
.rate{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:14px}
.rate button{font:700 15px/1.2 var(--f-body); border-radius:10px; padding:12px 6px; cursor:pointer; border:1px solid transparent; display:flex; flex-direction:column; align-items:center; gap:3px}
.rate button small{font-weight:400; font-variant-numeric:tabular-nums; opacity:.85}
.r1{background:var(--bad-soft); color:var(--bad)}
.r2{background:var(--warn-soft); color:var(--warn)}
.r3{background:var(--good-soft); color:var(--good)}
.r4{background:var(--accent-soft); color:var(--ink)}
.rate button.suggest{border-color:currentColor; box-shadow:0 0 0 2px var(--surface) inset}
.kbd{color:var(--muted); font-size:13px; margin-top:12px; text-align:center}
kbd{font:700 11px/1 var(--f-body); border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; padding:2px 5px; color:var(--muted); background:var(--surface)}
.opts{display:grid; gap:8px; margin-top:12px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; font:400 17px/1.35 var(--f-body); color:var(--fg); padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft); border-color:var(--good); color:var(--good); font-weight:700}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.fb{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:15px}
.fb.good{background:var(--good-soft); color:var(--good)}
.fb.bad{background:var(--bad-soft); color:var(--bad)}
.fb.warn{background:var(--warn-soft); color:var(--warn)}
.type input, .field input, .field select, .field textarea, input[type=search]{width:100%; font:400 19px/1.3 var(--f-body); padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--fg)}
.type input:focus, .field input:focus, input[type=search]:focus, textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.acc{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px}
.acc button{font:700 15px/1 var(--f-body); min-width:34px; padding:8px 6px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--fg); cursor:pointer}
.acc button:hover{border-color:var(--accent)}
.q{font-size:21px; font-weight:700; line-height:1.35; margin:4px 0 6px}
.over{background:var(--warn-soft); color:var(--warn); padding:10px 14px; border-radius:10px; margin-bottom:12px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; font-size:15px}
.over .btn{padding:8px 12px}

/* lesson prose */
.lesson h2{font-size:25px; margin-bottom:10px}
.prose{display:flex; flex-direction:column; gap:12px; max-width:65ch}
.prose i{font-style:normal; color:var(--ink); font-weight:700; cursor:pointer; text-decoration:underline dotted var(--line-strong); text-underline-offset:4px}
.prose i:hover{text-decoration-color:var(--accent)}
.tbl{overflow-x:auto}
.prose table{border-collapse:collapse; font-size:15px; min-width:100%}
.prose th, .prose td{padding:7px 12px 7px 0; text-align:left; border-bottom:1px solid var(--line-strong); white-space:nowrap}
.prose th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
details summary{cursor:pointer; font-weight:700; color:var(--accent)}
.refresh{margin-bottom:16px; padding-bottom:14px; border-bottom:1px dashed var(--line-strong)}
.refresh details{margin-top:6px}
.refresh .prose{margin-top:10px}

/* listening */
.how{margin:0 0 14px; padding-left:20px; color:var(--muted); font-size:15px}
.how b{color:var(--fg)}
.dlg{list-style:none; padding:0; margin:18px 0 0; display:flex; flex-direction:column; gap:12px}
.dlg li{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start}
.dlg li.b{padding-left:22px}
.dlg .ln{min-width:0}
.dlg .who{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--red)}
.dlg li.b .who{color:var(--muted)}
.dlg .fr{font-size:18px; line-height:1.4}
.dlg .en{font-size:15px; color:var(--muted)}
.blur{filter:blur(6px); user-select:none; -webkit-user-select:none}
.badge{font-size:12px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap; align-self:center}
.badge.good{background:var(--good-soft); color:var(--good)}
.badge.warn{background:var(--warn-soft); color:var(--warn)}
.badge.bad{background:var(--bad-soft); color:var(--bad)}
.diff{font-size:19px; line-height:1.6; margin-top:12px}
.diff .ok{color:var(--good)}
.diff .acc-x{color:var(--warn); text-decoration:underline wavy}
.diff .miss{color:var(--bad); text-decoration:underline}

/* done */
.done{text-align:left}
.hand{font-family:var(--f-hand); color:var(--red); font-size:30px; line-height:1.8}
.tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:16px}
.tile{border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--surface)}
.tile b{display:block; font-family:var(--f-display); font-size:26px; font-variant-numeric:tabular-nums; color:var(--ink)}
.tile span{font-size:13px; color:var(--muted)}

/* words */
.unit-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 0 8px; flex-wrap:wrap}
.unit-h h3 span{color:var(--muted); font-weight:500}
.wl{list-style:none; margin:0; padding:0; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); overflow:hidden}
.wl li{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border)}
.wl li:last-child{border-bottom:0}
.wl .fr{overflow-wrap:anywhere}
.wl .en{color:var(--muted); font-size:15px; overflow-wrap:anywhere}
.wl li.locked{opacity:.55}
.chip{font-size:12px; font-weight:700; padding:3px 8px; border-radius:99px; background:var(--heat0); color:var(--muted); white-space:nowrap}
.chip.due{background:var(--warn-soft); color:var(--warn)}
.chip.strong{background:var(--good-soft); color:var(--good)}
.chip.learn{background:var(--accent-soft); color:var(--ink)}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; font-weight:700; color:var(--muted)}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:14px}
.del{color:var(--bad)}

/* progress */
.statgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.hm-wrap{overflow-x:auto}
.hm{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,13px); grid-auto-columns:13px; gap:3px; margin-top:12px}
.hm i{border-radius:3px; background:var(--heat0)}
.hm i.l1{background:var(--heat1)} .hm i.l2{background:var(--heat2)} .hm i.l3{background:var(--heat3)} .hm i.l4{background:var(--heat4)}
.hm i.today{outline:2px solid var(--red); outline-offset:1px}
.hm i.pad{background:transparent}
.legend{display:flex; gap:4px; align-items:center; font-size:12px; color:var(--muted); margin-top:8px}
.legend i{width:12px; height:12px; border-radius:3px; display:inline-block}
.scale{position:relative; height:46px; margin:36px 0 28px}
.scale .track{position:absolute; left:0; right:0; top:18px; height:10px; background:var(--heat0); border-radius:99px}
.scale .band{position:absolute; top:18px; height:10px; background:var(--heat2); border-radius:2px}
.scale .band span{position:absolute; top:16px; left:0; font-size:12px; color:var(--muted); white-space:nowrap}
.scale .you{position:absolute; top:6px; width:3px; height:34px; background:var(--red); border-radius:2px}
.scale .you span{position:absolute; bottom:36px; left:50%; transform:translateX(-50%); font-size:12px; font-weight:700; color:var(--red); white-space:nowrap}
.fc{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; align-items:end; height:120px; margin-top:12px}
.fc div{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; min-width:0}
.fc b{font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg)}
.fc i{display:block; width:100%; max-width:34px; background:var(--accent); border-radius:5px 5px 2px 2px; min-height:2px}
.fc span{font-size:12px; color:var(--muted)}

/* plan */
.principles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.principle h3{margin-bottom:6px}
.principle p{color:var(--muted); font-size:15px}
.principle .src{font-size:13px; margin-top:8px}
.phase-list{display:grid; gap:12px}
.phase-card h3{font-size:20px}
.phase-card .lvl{font-size:13px; font-weight:700; color:var(--red); letter-spacing:.06em; text-transform:uppercase}
.phase-card ul{margin:10px 0 0; padding-left:18px; color:var(--muted); font-size:15px; columns:2; column-gap:24px}
.phase-card .daily{margin-top:12px; font-size:15px}
.htable{width:100%; border-collapse:collapse; font-size:15px; margin-top:10px}
.htable td,.htable th{padding:8px 10px 8px 0; border-bottom:1px solid var(--border); text-align:left; vertical-align:top}
.htable th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.htable td.num{white-space:nowrap}
.srcs{font-size:14px; color:var(--muted); padding-left:18px; display:flex; flex-direction:column; gap:4px}

#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:.25s; max-width:calc(100% - 32px); z-index:20}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  :root{--margin:26px}

{ id:"p1", n:1, name:"Les sons et la survie", en:"Sounds & survival", level:"A0 → A1",

  { id:"p1u1", title:"Bonjour !", en:"Greetings & politeness",

    lesson:{t:"Silent final letters", h:`<p>Most final consonants in French are <b>silent</b>. <i>petit</i> sounds like “puh-TEE” and <i>beaucoup</i> like “boh-KOO”.</p>
<p>A handy exception: final <b>C, R, F</b> and <b>L</b> (think “CaReFuL”) are usually pronounced: <i>avec</i>, <i>bonjour</i>, <i>neuf</i>, <i>il</i>. The big exception to the exception is the verb ending <b>-er</b>, which sounds like “ay”: <i>parler</i>.</p>
<p>A final <b>-e</b> with no accent is silent, but it makes the consonant before it heard: <i>madame</i> ends on the “m”.</p>
<p>The letter <b>h</b> is always silent: <i>hôtel</i> sounds like “oh-TEL”. Tap any blue example to hear it.</p>`},

  { id:"p1u2", title:"Je m'appelle…", en:"Introducing yourself",

    lesson:{t:"Tu or vous?", h:`<p>French has two words for “you”. <b>Tu</b> is for one person you know well: friends, family, children, pets.</p>
<p><b>Vous</b> is for anyone you'd address politely (a shopkeeper, a stranger, your boss) and for <b>more than one person</b>, whoever they are.</p>
<p>When in doubt, use <b>vous</b>. People will tell you when to switch: <i>On se tutoie ?</i> means “Shall we use tu?”.</p>
<p>The verb changes with the pronoun: <i>tu t'appelles</i> but <i>vous vous appelez</i>.</p>`},
    drills:[["Asking a stranger for directions, you use…",["vous","tu"],0,"Strangers get vous."],

    dialogue:`Bonjour ! Je m'appelle Léa. Et vous ?|Hello! My name is Léa. And you?

    lesson:{t:"Liaison: linking words", h:`<p>A final consonant is normally silent, but when the next word starts with a vowel sound, French often <b>links</b> the two. This is called <b>liaison</b>.</p>
<p><i>deux</i> on its own sounds like “duh”. In <i>deux amis</i> it becomes “duh-za-mee”. An s or x in liaison sounds like <b>z</b>.</p>
<p>Common liaisons: <i>les amis</i>, <i>vous avez</i>, <i>trois euros</i>, <i>dix euros</i>.</p>
<p>Some numbers also change before a consonant: <i>six</i> alone is “sees”, but in <i>six livres</i> it's “see”.</p>`},

  { id:"p1u4", title:"Être et avoir", en:"To be & to have",
    words:`je suis|I am

ils ont / elles ont|they have|liaison: “eel-zon”`,
    lesson:{t:"The two verbs you'll use most", h:`<p><b>être</b> (to be) and <b>avoir</b> (to have) are the two most frequent verbs in French. Both are irregular, so learn them as chunks.</p>
<table><tr><th></th><th>être</th><th>avoir</th></tr>
<tr><td>je / j'</td><td><i>je suis</i></td><td><i>j'ai</i></td></tr>
<tr><td>tu</td><td><i>tu es</i></td><td><i>tu as</i></td></tr>
<tr><td>il / elle</td><td><i>il est</i></td><td><i>il a</i></td></tr>
<tr><td>nous</td><td><i>nous sommes</i></td><td><i>nous avons</i></td></tr>
<tr><td>vous</td><td><i>vous êtes</i></td><td><i>vous avez</i></td></tr>
<tr><td>ils / elles</td><td><i>ils sont</i></td><td><i>ils ont</i></td></tr></table>
<p><b>Je</b> becomes <b>j'</b> before a vowel: <i>j'ai</i>, never “je ai”.</p>
<p>French uses <b>avoir</b> for age and some feelings: <i>J'ai trente ans</i> (I'm thirty), <i>j'ai faim</i> (I'm hungry), <i>j'ai froid</i> (I'm cold).</p>
<p>Listen closely: <i>ils sont</i> (they are, an s sound) and <i>ils ont</i> (they have, a z sound).</p>`},

    lesson:{t:"C'est or il y a?", h:`<p><b>C'est</b> identifies or describes something: <i>C'est mon ami</i> (This is my friend), <i>C'est bon !</i> (It's good!). The plural is <b>ce sont</b>, though in speech people often say c'est anyway.</p>
<p><b>Il y a</b> says that something exists or is present: <i>Il y a un café ici</i> (There's a café here), <i>Il y a trois chats</i> (There are three cats). It never changes for the plural.</p>
<p>Bonus: <b>il y a</b> + a time means “ago”: <i>il y a deux jours</i> = two days ago.</p>`},

    lesson:{t:"Polite requests and un / une", h:`<p><b>Je voudrais</b> (I would like) is the polite way to ask for anything. <i>Je veux</i> (I want) sounds blunt to French ears.</p>
<p>Every French noun is masculine or feminine. “A” is <b>un</b> for masculine words and <b>une</b> for feminine ones: <i>un café</i>, <i>une bière</i>. There's no fully reliable rule, so always learn a noun together with its article.</p>
<p>In a French café, <i>un café</i> is a small espresso. Ask for <i>un café crème</i> if you want milk.</p>`},

    lesson:{t:"Gender and articles", h:`<table><tr><th></th><th>the</th><th>a / some</th></tr>
<tr><td>masculine</td><td><i>le livre</i></td><td><i>un livre</i></td></tr>
<tr><td>feminine</td><td><i>la maison</i></td><td><i>une maison</i></td></tr>
<tr><td>before a vowel or silent h</td><td><i>l'homme</i></td><td><i>un homme</i></td></tr>
<tr><td>plural</td><td><i>les livres</i></td><td><i>des livres</i></td></tr></table>
<p><b>Des</b> is the plural of un / une (“some”), and French needs it where English uses nothing: <i>J'ai des amis</i> = I have friends.</p>
<p>Gender clues, with exceptions: words ending in <b>-tion, -té, -ure</b> are usually feminine (<i>la nation</i>, <i>la liberté</i>, <i>la voiture</i>). Words ending in <b>-ment, -age, -eau</b> are usually masculine (<i>le moment</i>, <i>le fromage</i>, <i>le bureau</i>), though <i>la page</i> and <i>la plage</i> break the rule.</p>`},

  { id:"p2u2", title:"Les verbes en -er", en:"Regular verbs",

    lesson:{t:"Regular -er verbs", h:`<p>About 90% of French verbs end in <b>-er</b>, and almost all follow one pattern. Drop -er and add the ending:</p>
<table><tr><td><i>je parle</i></td><td><i>nous parlons</i></td></tr>
<tr><td><i>tu parles</i></td><td><i>vous parlez</i></td></tr>
<tr><td><i>il parle</i></td><td><i>ils parlent</i></td></tr></table>
<p>Good news for speaking: <b>parle, parles, parle, parlent</b> all sound exactly the same. Only the nous (-ons) and vous (-ez) forms sound different.</p>
<p>Before a vowel, je becomes j': <i>j'aime</i>, <i>j'habite</i>, <i>j'écoute</i>.</p>
<p>One spelling quirk: <i>manger</i> keeps an e with nous, so <i>nous mangeons</i>.</p>`},
    drills:[["Nous parl___ français.",["ons","ez","ent"],0,"nous → -ons."],

    dialogue:`Tu habites où ?|Where do you live?

Tu aimes ton travail ?|Do you like your job?

  { id:"p2u3", title:"La famille", en:"Family & pets",
    words:`la mère|the mother
le père|the father
les parents|parents / relatives
le frère|the brother
la sœur|the sister

    lesson:{t:"My, your, his, her", h:`<table><tr><th></th><th>masculine</th><th>feminine</th><th>plural</th></tr>
<tr><td>my</td><td><i>mon</i></td><td><i>ma</i></td><td><i>mes</i></td></tr>
<tr><td>your (tu)</td><td><i>ton</i></td><td><i>ta</i></td><td><i>tes</i></td></tr>
<tr><td>his / her</td><td><i>son</i></td><td><i>sa</i></td><td><i>ses</i></td></tr></table>
<p>The possessive agrees with the <b>thing owned</b>, not the owner. <i>son frère</i> means his brother <b>or</b> her brother; <i>sa sœur</i> means his sister or her sister.</p>
<p>Before a feminine word starting with a vowel, use mon / ton / son so it's easier to say: <i>mon amie</i>, not “ma amie”.</p>
<p>For plural owners: <i>notre / nos</i> (our), <i>votre / vos</i> (your), <i>leur / leurs</i> (their).</p>`},

    lesson:{t:"Three ways to ask", h:`<p>1. <b>Intonation</b>, the most common in speech: just raise your voice at the end. <i>Tu viens ?</i></p>
<p>2. <b>Est-ce que</b> at the start: <i>Est-ce que tu viens ?</i> It works with question words too: <i>Où est-ce que tu habites ?</i></p>
<p>3. <b>Inversion</b>, formal and written: <i>Viens-tu ?</i> <i>Où habitez-vous ?</i></p>
<p><b>Qu'est-ce que</b> means “what” at the start of a question: <i>Qu'est-ce que tu fais ?</i> (What are you doing?). Casual speech puts <b>quoi</b> at the end instead: <i>Tu fais quoi ?</i></p>

    lesson:{t:"The negation sandwich", h:`<p>Wrap the conjugated verb with <b>ne … pas</b>: <i>Je ne parle pas anglais.</i> Before a vowel, ne becomes n': <i>Je n'aime pas le café.</i></p>
<p>Swap pas for other words: <b>ne … jamais</b> (never), <b>ne … plus</b> (not anymore), <b>ne … rien</b> (nothing).</p>
<p>After a negation, un / une / des become <b>de</b>: <i>J'ai un chien</i> → <i>Je n'ai pas de chien.</i></p>
<p>In everyday speech people often drop the ne: <i>Je sais pas.</i> Understand it, but write the full form.</p>
<p><b>aller</b> (to go) and <b>faire</b> (to do / make) are irregular and very common. <i>Ça va ?</i> literally means “it goes?”.</p>`},
    drills:[["Je ___ aime ___ les épinards.",["n' … pas","ne … pas","pas … ne"],0,"Before a vowel, ne → n'."],
      ["J'ai une voiture. → Je n'ai pas ___ voiture.",["de","une","la"],0,"un / une become de after a negation."],
      ["Nous ___ au cinéma. (We're going)",["allons","allez","vont"],0,"nous allons."],
      ["« Je ne fume plus » means…",["I don't smoke anymore","I never smoke"],0,"ne … plus = no longer."],
      ["Ils ___ à Paris.",["vont","vas","allons"],0,"ils vont."]],
    dialogue:`Tu vas au cinéma ce soir ?|Are you going to the movies tonight?
Non, je ne vais pas au cinéma. Je suis fatigué.|No, I'm not going to the movies. I'm tired.
Qu'est-ce que tu fais, alors ?|What are you doing, then?
Rien ! Je reste à la maison.|Nothing! I'm staying home.
Tu ne sors jamais !|You never go out!`},
  { id:"p2u6", title:"Les jours et l'heure", en:"Days & time",
    words:`aujourd'hui|today
demain|tomorrow
hier|yesterday
le matin|the morning
le soir|the evening
la semaine|the week
le week-end|the weekend
lundi|Monday
mardi|Tuesday
mercredi|Wednesday
jeudi|Thursday
vendredi|Friday
samedi|Saturday
dimanche|Sunday`,
    lesson:{t:"Days and telling time", h:`<p>Days and months are <b>not capitalized</b> in French: <i>lundi</i>, <i>janvier</i>.</p>
<p><i>lundi</i> = on Monday (this coming one). <i>le lundi</i> = on Mondays (every week).</p>
<p>Telling time uses <b>il est … heure(s)</b>: <i>Il est trois heures</i> (It's 3:00). Add <i>et quart</i> (:15), <i>et demie</i> (:30) or <i>moins le quart</i> (quarter to).</p>
<p>Timetables use the 24-hour clock: <i>vingt heures</i> is 8 p.m. “At” a time is <b>à</b>: <i>à midi</i> (at noon), <i>à neuf heures</i>.</p>`},
    drills:[["I work on Mondays (every week):",["Je travaille le lundi.","Je travaille lundi."],0,"le lundi = every Monday."],
      ["« Il est huit heures et demie » =",["8:30","8:15","7:30"],0,"et demie = half past."],
      ["« vingt heures » =",["8 p.m.","20 minutes","2 p.m."],0,"24-hour clock: 20h = 8 p.m."],
      ["Which is spelled correctly?",["mardi","Mardi"],0,"Days aren't capitalized."]],
    dialogue:`On se voit quand ?|When shall we meet?
Demain soir ? Vers sept heures ?|Tomorrow evening? Around seven?
Demain, je travaille. Samedi matin ?|Tomorrow I'm working. Saturday morning?
D'accord, samedi à dix heures.|OK, Saturday at ten.
Parfait. À samedi !|Perfect. See you Saturday!`},
  { id:"p2u7", title:"Les nombres jusqu'à 1000", en:"Bigger numbers",
    words:`vingt et un|twenty-one
trente|thirty
quarante|forty
cinquante|fifty
soixante|sixty
soixante-dix|seventy|60 + 10
soixante et onze|seventy-one|60 + 11
quatre-vingts|eighty|4 × 20
quatre-vingt-un|eighty-one
quatre-vingt-dix|ninety|4 × 20 + 10
cent|one hundred
mille|one thousand`,
    lesson:{t:"The 70–99 puzzle", h:`<p>Up to 69, French numbers are regular: <i>trente-deux</i>, <i>quarante-sept</i>. Note the <b>et un</b> in 21, 31, 41, 51 and 61: <i>vingt et un</i>.</p>
<p>From 70, France counts in twenties:</p>
<table><tr><td>70</td><td><i>soixante-dix</i></td><td>60 + 10</td></tr>
<tr><td>75</td><td><i>soixante-quinze</i></td><td>60 + 15</td></tr>
<tr><td>80</td><td><i>quatre-vingts</i></td><td>4 × 20</td></tr>
<tr><td>85</td><td><i>quatre-vingt-cinq</i></td><td>4 × 20 + 5</td></tr>
<tr><td>90</td><td><i>quatre-vingt-dix</i></td><td>4 × 20 + 10</td></tr>
<tr><td>99</td><td><i>quatre-vingt-dix-neuf</i></td><td>4 × 20 + 19</td></tr></table>
<p>The s of quatre-vingts drops when another number follows: <i>quatre-vingt-trois</i>.</p>
<p>Belgium and Switzerland say <b>septante</b> (70) and <b>nonante</b> (90), and parts of Switzerland say <b>huitante</b> (80).</p>`},
    drills:[["75 =",["soixante-quinze","soixante-cinq","sept-cinq"],0,"60 + 15."],
      ["92 =",["quatre-vingt-douze","quatre-vingt-deux","soixante-douze"],0,"4 × 20 + 12. (soixante-douze is 72.)"],
      ["81 =",["quatre-vingt-un","quatre-vingt et un","quatre-vingts-un"],0,"No et after 80, and the s drops."],
      ["31 =",["trente et un","trente-un"],0,"21–61 use et un."]],
    dialogue:`Ça fait combien ?|How much does that come to?
Ça fait quatre-vingt-dix-neuf euros.|That's ninety-nine euros.
Quatre-vingt-dix-neuf ? C'est cher !|Ninety-nine? That's expensive!
Avec la réduction, soixante-quinze euros.|With the discount, seventy-five euros.
D'accord, je le prends.|OK, I'll take it.`},
  { id:"p2u8", title:"Décrire", en:"Describing things",
    words:`grand / grande|big / tall
petit / petite|small / short
bon / bonne|good
mauvais / mauvaise|bad
beau / belle|beautiful / handsome
nouveau / nouvelle|new
vieux / vieille|old
jeune|young
content / contente|happy / pleased
fatigué / fatiguée|tired
facile|easy
difficile|difficult`,
    lesson:{t:"Agreement and word order", h:`<p>Adjectives agree with their noun. Add <b>-e</b> for feminine and <b>-s</b> for plural: <i>un ami content</i>, <i>une amie contente</i>, <i>des amis contents</i>. Adjectives that already end in -e don't change for feminine: <i>jeune</i>, <i>facile</i>.</p>
<p>Most adjectives go <b>after</b> the noun: <i>une voiture rouge</i>, <i>un livre difficile</i>.</p>
<p>A short list goes <b>before</b> the noun. Remember <b>BAGS</b>: Beauty (beau, joli), Age (jeune, vieux, nouveau), Goodness (bon, mauvais), Size (grand, petit). <i>une belle maison</i>, <i>un petit chat</i>.</p>
<p>Listen for the feminine: <i>petit</i> vs <i>petite</i>. The -e makes the t audible.</p>`},
    drills:[["une ___ maison (small)",["petite","petit","petits"],0,"Feminine: petite. Size → before the noun."],
      ["un livre ___ (difficult)",["difficile","difficiles","difficilé"],0,"Already ends in -e, and goes after the noun."],
      ["Elles sont ___ . (tired)",["fatiguées","fatigué","fatigués"],0,"Feminine plural: -ées."],
      ["Which word order is right?",["un bon restaurant","un restaurant bon"],0,"bon (Goodness) goes before."],
      ["une ___ voiture (new)",["nouvelle","nouveau","nouvel"],0,"The feminine of nouveau is nouvelle."]],
    dialogue:`Tu aimes ton nouvel appartement ?|Do you like your new apartment?
Oui ! Il est petit, mais très beau.|Yes! It's small, but very beautiful.
Et le quartier ?|And the neighborhood?
Il est jeune et sympa. Il y a un joli parc et un bon boulanger.|It's young and friendly. There's a nice park and a good baker.
Tu as de la chance !|You're lucky!`}
  ]},
{ id:"p3", n:3, name:"La construction", en:"Building up", level:"A2",
  goal:"Talk about the past and the future, use pronouns, get around a city, shop, and say what you can, want and must do.",
  daily:"15 min in the app + 10–15 min of input you mostly understand: learner podcasts, easy readers, or kids' shows with French subtitles. About 25–30 min in total.",
  extra:"Spend 10–15 minutes on French input you mostly understand: a learner podcast, an easy reader, or a cartoon with French subtitles. Log it in Progrès.",
  units:[
  { id:"p3u1", title:"Le passé composé (avoir)", en:"The past with avoir",
    words:`j'ai mangé|I ate / I have eaten
j'ai parlé|I spoke
j'ai fini|I finished
j'ai fait|I did / I made
j'ai vu|I saw
j'ai pris|I took
j'ai eu|I had
j'ai été|I was / I've been
j'ai dit|I said
j'ai bu|I drank
j'ai écrit|I wrote
j'ai lu|I read (past tense)`,
    lesson:{t:"Talking about the past", h:`<p>The <b>passé composé</b> is the everyday past tense: <b>avoir</b> in the present + a <b>past participle</b>.</p>
<p><i>J'ai mangé</i> = I ate / I have eaten. <i>Nous avons parlé</i> = we spoke.</p>
<p>Participles: <b>-er → -é</b> (<i>parlé</i>, <i>mangé</i>), <b>-ir → -i</b> (<i>fini</i>, <i>choisi</i>). Many common verbs are irregular: faire → <i>fait</i>, voir → <i>vu</i>, prendre → <i>pris</i>, avoir → <i>eu</i>, être → <i>été</i>, dire → <i>dit</i>, boire → <i>bu</i>, lire → <i>lu</i>, écrire → <i>écrit</i>.</p>
<p>Negation wraps around avoir: <i>Je n'ai pas mangé.</i></p>`},
    drills:[["Hier, nous ___ un film. (watched)",["avons regardé","avons regarder","sommes regardé"],0,"avoir + participle in -é."],
      ["Tu ___ mon message ? (Did you see…)",["as vu","as voir","es vu"],0,"voir → vu."],
      ["I didn't finish:",["Je n'ai pas fini.","Je n'ai fini pas.","Je ne pas ai fini."],0,"ne … pas goes around avoir."],
      ["prendre → j'ai ___",["pris","prendu","prené"],0,"Irregular: pris."]],
    dialogue:`Qu'est-ce que tu as fait ce week-end ?|What did you do this weekend?
Samedi, j'ai vu mes parents. On a mangé au restaurant.|On Saturday I saw my parents. We ate at a restaurant.
C'était bon ?|Was it good?
Très bon ! Et toi ?|Very good! And you?
Moi, j'ai lu un livre et j'ai pris un long bain.|I read a book and took a long bath.`},
  { id:"p3u2", title:"Le passé composé (être)", en:"The past with être",
    words:`je suis allé(e)|I went|add -e if you're a woman (same sound)
je suis venu(e)|I came
je suis arrivé(e)|I arrived
je suis parti(e)|I left
je suis entré(e)|I went in
je suis sorti(e)|I went out
je suis resté(e)|I stayed
je suis né(e)|I was born
je suis tombé(e)|I fell
je suis rentré(e)|I came back home`,
    lesson:{t:"Verbs that use être", h:`<p>About 15 verbs, mostly about <b>movement or change of state</b>, form the passé composé with <b>être</b> instead of avoir: aller, venir, arriver, partir, entrer, sortir, monter, descendre, rester, tomber, naître, mourir, devenir, retourner, rentrer.</p>
<p>Picture a house: you <i>arrive</i>, go <i>in</i>, go <i>up</i>, <i>fall</i>, <i>leave</i>…</p>
<p>With être, the participle <b>agrees with the subject</b>: <i>il est allé</i>, <i>elle est allée</i>, <i>ils sont allés</i>, <i>elles sont allées</i>. The extra -e or -s is silent.</p>
<p>Reflexive verbs also use être: <i>je me suis levé</i> (I got up).</p>`},
    drills:[["Elle ___ à Paris.",["est allée","a allé","est allé"],0,"aller uses être and agrees: allée."],
      ["Nous ___ tard. (arrived)",["sommes arrivés","avons arrivé","sommes arrivé"],0,"être + plural agreement."],
      ["Il ___ un café. (drank)",["a bu","est bu"],0,"boire isn't a movement verb → avoir."],
      ["Marie ___ en 1990. (was born)",["est née","a né","est né"],0,"naître → née (feminine)."]],
    dialogue:`Tu es rentrée quand ?|When did you get back?
Je suis rentrée hier soir. Le train est arrivé en retard.|I got back last night. The train arrived late.
Tu es restée combien de temps à Lyon ?|How long did you stay in Lyon?
Une semaine. Je suis sortie tous les soirs !|A week. I went out every night!
Ça a l'air génial !|Sounds great!`},
  { id:"p3u3", title:"Les projets", en:"Plans & the near future",
    words:`je vais partir|I'm going to leave
on va manger|we're going to eat
bientôt|soon
plus tard|later
la semaine prochaine|next week
l'année prochaine|next year
d'abord|first
ensuite|then / next
enfin|finally
avoir envie de|to feel like (doing)
espérer|to hope
le projet|the plan / the project`,
    lesson:{t:"Near future and « on »", h:`<p>The easiest way to talk about the future is <b>aller + infinitive</b>: <i>Je vais partir</i> (I'm going to leave), <i>Il va pleuvoir</i> (It's going to rain). Negation wraps aller: <i>Je ne vais pas partir.</i></p>
<p><b>On</b> is everywhere in spoken French and usually means <b>we</b>. It takes the il / elle form of the verb: <i>On va au cinéma ?</i> = Shall we go to the movies?</p>
<p>Put events in order with <i>d'abord</i> (first), <i>ensuite</i> or <i>puis</i> (then), and <i>enfin</i> (finally).</p>`},
    drills:[["Demain, je ___ travailler.",["vais","va","allons"],0,"je vais + infinitive."],
      ["On ___ manger ensemble ?",["va","allons","vont"],0,"on takes the il form."],
      ["I'm not going to leave:",["Je ne vais pas partir.","Je vais ne pas partir.","Je ne vais partir pas."],0,"Negate aller."],
      ["___, ensuite, enfin",["D'abord","Bientôt","Plus tard"],0,"d'abord = first."]],
    dialogue:`Qu'est-ce que tu vas faire cet été ?|What are you going to do this summer?
D'abord, je vais travailler. Ensuite, on va partir en Bretagne.|First I'm going to work. Then we're going to Brittany.
Super ! Vous allez faire du camping ?|Great! Are you going camping?
Oui, j'ai très envie de voir la mer.|Yes, I really feel like seeing the sea.`},
  { id:"p3u4", title:"Les pronoms", en:"Him, her, it, them",
    words:`je le vois|I see him / I see it
je la connais|I know her
je les aime|I love them
je lui parle|I'm talking to him / to her
je leur téléphone|I'm calling them
tu me comprends ?|do you understand me?
je t'aime|I love you
j'y vais|I'm going (there)
j'en veux|I want some
il y en a|there are some / there is some`,
    lesson:{t:"Object pronouns go before the verb", h:`<p>English says “I see <b>him</b>”. French says “I <b>him</b> see”: <i>Je le vois.</i></p>
<table><tr><td>direct</td><td><i>le</i> (him / it), <i>la</i> (her / it), <i>les</i> (them)</td></tr>
<tr><td>indirect, “to someone”</td><td><i>lui</i> (to him / her), <i>leur</i> (to them)</td></tr>
<tr><td>both</td><td><i>me</i>, <i>te</i>, <i>nous</i>, <i>vous</i></td></tr>
<tr><td>place</td><td><i>y</i> (there)</td></tr>
<tr><td>quantity</td><td><i>en</i> (some, of it)</td></tr></table>
<p>le and la become <b>l'</b> before a vowel: <i>Je l'aime.</i></p>
<p>Verbs like parler à, téléphoner à and donner à take indirect pronouns: <i>Je lui parle.</i></p>
<p>With aller + infinitive, the pronoun goes before the infinitive: <i>Je vais le faire.</i></p>`},
    drills:[["Tu vois Marie ? Oui, je ___ vois.",["la","lui","le"],0,"Direct object, feminine → la."],
      ["Tu parles à Paul ? Oui, je ___ parle.",["lui","le","la"],0,"parler à → indirect → lui."],
      ["Tu vas à la gare ? Oui, j'___ vais.",["y","en","le"],0,"y replaces a place."],
      ["Tu veux du café ? Oui, j'___ veux.",["en","y","le"],0,"en replaces du / de la / des + noun."],
      ["I'm going to do it:",["Je vais le faire.","Je le vais faire."],0,"The pronoun goes before the infinitive."]],
    dialogue:`Tu connais Sophie ?|Do you know Sophie?
Oui, je la connais bien. Je lui parle tous les jours.|Yes, I know her well. I talk to her every day.
Elle vient à la fête ce soir ?|Is she coming to the party tonight?
Je ne sais pas. Je vais lui téléphoner.|I don't know. I'm going to call her.
Il reste du gâteau ?|Is there any cake left?
Oui, il y en a dans la cuisine.|Yes, there's some in the kitchen.`},
  { id:"p3u5", title:"En ville", en:"Getting around",
    words:`la gare|the train station
la rue|the street
à gauche|on the left / to the left
à droite|on the right / to the right
tout droit|straight ahead
près de|near
loin de|far from
à côté de|next to
en face de|opposite / across from
le métro|the subway
prendre|to take
où est… ?|where is… ?`,
    lesson:{t:"à and de merge with le", h:`<p>The prepositions <b>à</b> (to / at) and <b>de</b> (of / from) fuse with <b>le</b> and <b>les</b>:</p>
<table><tr><td>à + le</td><td><i>au</i></td><td>de + le</td><td><i>du</i></td></tr>
<tr><td>à + les</td><td><i>aux</i></td><td>de + les</td><td><i>des</i></td></tr></table>
<p>la and l' don't change: <i>Je vais au marché</i>, <i>à la gare</i>, <i>à l'hôtel</i>. <i>C'est près du parc</i>, <i>en face de la banque</i>.</p>
<p>Cities take à: <i>à Paris</i>. Most feminine countries take en: <i>en France</i>. Masculine ones take au: <i>au Canada</i>.</p>
<p>Ask politely: <i>Excusez-moi, où est la gare, s'il vous plaît ?</i></p>`},
    drills:[["Je vais ___ cinéma.",["au","à le","à la"],0,"à + le = au."],
      ["C'est à côté ___ hôpital.",["de l'","du","de le"],0,"Before a vowel or silent h: de l'."],
      ["Elle habite ___ Canada.",["au","en","à"],0,"Masculine country → au."],
      ["Nous allons ___ France.",["en","au","à la"],0,"Feminine country → en."],
      ["C'est en face ___ musée.",["du","de le","de la"],0,"de + le = du."]],
    dialogue:`Excusez-moi, où est la gare, s'il vous plaît ?|Excuse me, where's the train station, please?
C'est tout droit, puis la deuxième rue à gauche.|It's straight ahead, then the second street on the left.
C'est loin d'ici ?|Is it far from here?
Non, dix minutes à pied. Ou vous pouvez prendre le métro.|No, ten minutes on foot. Or you can take the subway.
Merci beaucoup !|Thanks a lot!`},
  { id:"p3u6", title:"Les courses", en:"Shopping & quantities",
    words:`le marché|the market
le pain|bread
le fromage|cheese
la viande|meat
les légumes|vegetables
les fruits|fruit
un kilo de|a kilo of
une bouteille de|a bottle of
un peu de|a little (of)
beaucoup de|a lot of
assez de|enough
trop de|too much / too many`,
    lesson:{t:"Some: du, de la, des", h:`<p>French usually needs an article where English says “some” or nothing at all. For things you don't count, use the <b>partitive</b>:</p>
<table><tr><td>masculine</td><td><i>du pain</i></td></tr><tr><td>feminine</td><td><i>de la viande</i></td></tr><tr><td>before a vowel</td><td><i>de l'eau</i></td></tr><tr><td>plural</td><td><i>des légumes</i></td></tr></table>
<p><i>Je mange du pain.</i> = I eat (some) bread. For likes and dislikes, use le / la / les: <i>J'aime le pain.</i></p>
<p>After a quantity, everything becomes plain <b>de</b>: <i>beaucoup de pain</i>, <i>un kilo de tomates</i>, <i>une bouteille d'eau</i>. Same after a negation: <i>Je ne mange pas de viande.</i></p>`},
    drills:[["Je voudrais ___ fromage.",["du","de la","le"],0,"Some cheese, masculine → du."],
      ["Un kilo ___ pommes, s'il vous plaît.",["de","des","du"],0,"After a quantity: de."],
      ["J'adore ___ chocolat.",["le","du","de"],0,"Likes and dislikes use le / la / les."],
      ["Il ne boit pas ___ alcool.",["d'","de l'","du"],0,"After a negation: de, written d' before a vowel."],
      ["Tu veux ___ eau ?",["de l'","du","de la"],0,"Before a vowel: de l'."]],
    dialogue:`Bonjour ! Qu'est-ce qu'il vous faut ?|Hello! What do you need?
Je voudrais un kilo de tomates et du fromage.|I'd like a kilo of tomatoes and some cheese.
Du comté ? Il est excellent aujourd'hui.|Some Comté? It's excellent today.
Parfait, un petit morceau. Et une bouteille de cidre.|Perfect, a small piece. And a bottle of cider.
Voilà. Avec ceci ?|Here you go. Anything else?
Non, c'est tout, merci.|No, that's all, thanks.`},
  { id:"p3u7", title:"Vouloir, pouvoir, devoir", en:"Want, can, must",
    words:`je veux|I want
je peux|I can / I may
je dois|I must / I have to
il faut|it's necessary / you have to
tu peux… ?|can you… ?
je ne peux pas|I can't
on doit|we have to
elle veut|she wants
je sais|I know (a fact / how to)
je connais|I know (a person / a place)`,
    lesson:{t:"Modal verbs + infinitive", h:`<p><b>vouloir</b> (want), <b>pouvoir</b> (can) and <b>devoir</b> (must) are followed directly by an infinitive: <i>Je veux partir.</i> <i>Tu peux m'aider ?</i> <i>On doit travailler.</i></p>
<table><tr><td><i>je veux</i></td><td><i>je peux</i></td><td><i>je dois</i></td></tr>
<tr><td><i>il veut</i></td><td><i>il peut</i></td><td><i>il doit</i></td></tr>
<tr><td><i>nous voulons</i></td><td><i>nous pouvons</i></td><td><i>nous devons</i></td></tr>
<tr><td><i>ils veulent</i></td><td><i>ils peuvent</i></td><td><i>ils doivent</i></td></tr></table>
<p><b>Il faut</b> + infinitive is impersonal and very common: <i>Il faut réserver.</i> (You need to book.)</p>
<p><b>savoir</b> = know facts or how to do something: <i>Je sais nager.</i> <b>connaître</b> = be familiar with people and places: <i>Je connais Paris.</i></p>`},
    drills:[["Tu ___ m'aider ? (Can you help me?)",["peux","veux","dois"],0,"pouvoir = can."],
      ["Je ___ Marie depuis dix ans.",["connais","sais"],0,"People → connaître."],
      ["Je ___ parler espagnol.",["sais","connais"],0,"Know how to → savoir."],
      ["Ils ___ partir à six heures. (must)",["doivent","devons","doit"],0,"ils doivent."],
      ["___ réserver une table. (You need to)",["Il faut","Il doit","On faut"],0,"il faut + infinitive."]],
    dialogue:`Tu peux venir dîner samedi ?|Can you come to dinner on Saturday?

/* ================= index ================= */
const UNITS = [], ITEMS = {};
PHASES.forEach(p => p.units.forEach((u, ui) => {
  u.phase = p; u.idx = UNITS.length; u.code = p.n + "." + (ui + 1);
  u.items = lines(u.words).map((r, i) => (ITEMS[u.id + "-" + i] = { id: u.id + "-" + i, fr: r[0], en: r[1], note: r[2] || "", unit: u }));
  u.lines = lines(u.dialogue);
  UNITS.push(u);
}));
const TOTAL_WORDS = UNITS.reduce((a, u) => a + u.items.length, 0);
function lines(t) { return t.trim().split("\n").map(l => l.trim()).filter(Boolean).map(l => l.split("|").map(s => s.trim())); }

/* ================= state ================= */
const KEY = "carnet-fr-v1";
function defaults() {
  return { v: 1, prefs: { minutes: 15, newPerDay: 6, rate: 0.9, voice: "", autoplay: true, typing: true },
    cards: {}, custom: [], prog: { unit: 0, passed: {} }, log: {}, created: todayKey(), sessions: 0 };
}
let S = load();
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch (e) { raw = null; }
  const d = defaults();
  if (!raw || typeof raw !== "object") return d;
  return Object.assign(d, raw, { prefs: Object.assign(d.prefs, raw.prefs || {}), prog: Object.assign(d.prog, raw.prog || {}) });
}
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast("This browser isn't saving progress. Use Export in Réglages to keep a copy."); } }
}

/* ================= dates ================= */
function pad(n) { return String(n).padStart(2, "0"); }
function todayKey(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dnum(k) { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
function keyOf(n) { const d = new Date(n * 864e5); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
const TODAY = () => dnum(todayKey());
function L(k = todayKey()) { return S.log[k] || (S.log[k] = { m: 0, r: 0, n: 0, x: 0 }); }
function frDate() {
  let s; try { s = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(new Date()); } catch (e) { s = todayKey(); }
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2600); }
function itemById(id) {
  if (ITEMS[id]) return ITEMS[id];
  const c = S.custom.find(x => x.id === id);
  return c ? { id: c.id, fr: c.fr, en: c.en, note: c.note || "", unit: null } : null;
}
function curUnit() { return UNITS[S.prog.unit] || null; }
function curPhase() { const u = curUnit(); return u ? u.phase : PHASES[PHASES.length - 1]; }
function dueIds() { const t = TODAY(); return Object.keys(S.cards).filter(id => itemById(id) && S.cards[id].due <= t); }
function fmtIvl(d) { if (d < 1) return "today"; if (d === 1) return "1 day"; if (d < 30) return d + " days"; if (d < 365) return Math.round(d / 30) + " mo"; return (d / 365).toFixed(1) + " yr"; }
function fmtMin(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ":" + pad(s); }
function unitLabel(u) { return u ? u.code + " · " + u.title : "Mes mots"; }

/* ================= speech ================= */
const TTS = {
  ok: "speechSynthesis" in window, voices: [], voice: null,
  load() {
    if (!this.ok) return;
    const all = speechSynthesis.getVoices();
    this.voices = all.filter(v => /^fr/i.test(v.lang));
    const fr = this.voices.filter(v => /fr[-_]FR/i.test(v.lang));
    this.voice = this.voices.find(v => v.name === S.prefs.voice)
      || fr.find(v => /(Google|Amélie|Amelie|Audrey|Thomas|Denise|Henri|Marie|Natural|Enhanced|Premium)/i.test(v.name))
      || fr[0] || this.voices[0] || null;
  },
  clean(t) { return t.replace(/\(e\)/g, "").replace(/\s\/\s/g, ", ").replace(/…/g, " ").replace(/«|»/g, "").replace(/\s+/g, " ").trim(); },
  utter(t, o = {}) {
    const u = new SpeechSynthesisUtterance(this.clean(t));
    const v = o.voice || this.voice; u.lang = v ? v.lang : "fr-FR"; if (v) u.voice = v;
    u.rate = o.rate || S.prefs.rate; if (o.pitch) u.pitch = o.pitch; return u;
  },
  say(t, o) { if (!this.ok) { toast("This browser can't play speech. Try Chrome, Edge or Safari."); return; } speechSynthesis.cancel(); speechSynthesis.speak(this.utter(t, o)); },
  seq(list, o = {}) {
    if (!this.ok) { toast("This browser can't play speech."); return; }
    speechSynthesis.cancel();
    const alt = this.voices.find(v => v !== this.voice && /fr[-_]FR/i.test(v.lang));
    list.forEach((t, i) => speechSynthesis.speak(this.utter(t, { rate: o.rate, voice: i % 2 && alt ? alt : null, pitch: i % 2 && !alt ? 0.8 : 1 })));
  }
};
if (TTS.ok) { TTS.load(); speechSynthesis.onvoiceschanged = () => { TTS.load(); if (cur === "prefs") render(); }; }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* ================= course progression ================= */

  }

function statusChip(id, u) {

  if (c.ivl >= 21) return `<span class="chip strong">strong · ${fmtIvl(d)}</span>`;
  return `<span class="chip">in ${fmtIvl(d)}</span>`;
}

/* ================= views: progress ================= */
function vProgress() {
  const h = totalHours(), all = Object.values(S.cards), strong = all.filter(c => c.ivl >= 21).length;
  const t = TODAY(), weeks = 18, todayDow = (new Date().getDay() + 6) % 7, start = t - todayDow - (weeks - 1) * 7;
  const target = S.prefs.minutes * 60; let cells = "";
  for (let d = start; d <= t + (6 - todayDow); d++) {
    if (d > t) { cells += `<i class="pad"></i>`; continue; }
    const l = S.log[keyOf(d)], m = l ? (l.m || 0) + (l.x || 0) * 60 : 0;
    const lv = !m ? 0 : m >= target ? 4 : m >= target * .66 ? 3 : m >= target * .33 ? 2 : 1;
    cells += `<i class="l${lv} ${d === t ? "today" : ""}" title="${keyOf(d)}: ${Math.round(m / 60)} min"></i>`;
  }
  const fc = []; for (let i = 0; i < 7; i++) fc.push(all.filter(c => i === 0 ? c.due <= t : c.due === t + i).length);
  const fmax = Math.max(1, ...fc), days = ["Today", "+1", "+2", "+3", "+4", "+5", "+6"];
  const max = Math.max(420, h.all * 1.15), pos = v => (v / max * 100).toFixed(2) + "%";
  return `<div class="stack" style="gap:22px">
  <h1>Progrès <span class="muted" style="font-weight:500;font-size:.6em">· Progress</span></h1>
  <div class="statgrid"><div class="tile"><b>${streak()}</b><span>day streak · best ${bestStreak()}</span></div><div class="tile"><b>${h.all.toFixed(1)}</b><span>hours (${h.app.toFixed(1)} in app)</span></div><div class="tile"><b>${all.length}</b><span>words learned</span></div><div class="tile"><b>${strong}</b><span>strong (3+ weeks)</span></div></div>
  <section class="card"><h3>Last ${weeks} weeks</h3><div class="hm-wrap"><div class="hm" role="img" aria-label="Study calendar">${cells}</div></div>
    <div class="legend">Less <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> ${S.prefs.minutes}+ min</div></section>
  <section class="card"><h3>Hours toward each level</h3>
    <p class="muted" style="font-size:15px;margin-top:6px;max-width:60ch">Rough guided-learning estimates: A1 takes about 60–100 hours and B1 about 350–400. Listening and reading outside the app count, so log them.</p>
    <div class="scale"><div class="track"></div><div class="band" style="left:${pos(60)};width:calc(${pos(100)} - ${pos(60)})"><span>A1</span></div><div class="band" style="left:${pos(350)};width:calc(${pos(400)} - ${pos(350)})"><span>B1</span></div><div class="you" style="left:${pos(Math.min(h.all, max))}"><span style="${h.all / max < 0.12 ? "left:0;transform:none" : h.all / max > 0.88 ? "left:auto;right:0;transform:none" : ""}">You · ${h.all.toFixed(1)} h</span></div></div>
    <div class="row"><span class="muted" style="font-size:14px">Log outside practice today:</span><button class="btn" data-act="logx" data-m="10">+10 min</button><button class="btn" data-act="logx" data-m="20">+20 min</button><button class="btn" data-act="logx" data-m="30">+30 min</button>${L().x ? `<span class="muted num" style="font-size:14px">${L().x} min logged today</span>` : ""}</div></section>
  <section class="card"><h3>Reviews coming up</h3><div class="fc">${fc.map((v, i) => `<div><b>${v}</b><i style="height:${Math.round(v / fmax * 80)}px"></i><span>${days[i]}</span></div>`).join("")}</div></section>
  </div>`;
}

/* ================= views: plan ================= */
function vPlan() {
  const m = S.prefs.minutes;
  const P = [
    ["Little and often", `Short daily sessions beat long weekly ones. In a classic study of high-school French vocabulary, three 10-minute sessions on separate days produced about 35% better recall four days later than one 30-minute block.`, "Bloom & Shuell, 1981", "https://www.gwern.net/doc/psychology/spaced-repetition/1981-bloom.pdf"],
    ["Recall, then check", `Trying to pull a word from memory and then checking (retrieval practice), repeated at growing intervals (spacing), is one of the most reliable ways to make foreign vocabulary stick long-term. Your cards return after 1 day, then 3, then roughly ×2.5 each time.`, "Bahrick et al., 1993", "https://www.gwern.net/doc/psychology/spaced-repetition/1993-bahrick.pdf"],
    ["Repeat new words before spacing them", `Spacing only pays off once you can retrieve a word at all, and harder words need more early repetitions. So each new word is quizzed twice on the day you meet it, and missed cards come back within the same session.`, "Cognitive Science Society, 2025", "https://escholarship.org/uc/item/61p4p686"],
    ["Most frequent words first", `A small core does most of the work: the 1,000 most common French words cover roughly 80–85% of what's said on screen, and the top 2,000 word families cover about 85% of typical texts. The course teaches these core words and chunks first.`, "Cobb & Horst, 2004", "https://www.lextutor.ca/cv/awl_F.htm"],
    ["Say it out loud", `Producing words aloud helped learners remember vocabulary better than only comprehending it. Pronunciation is also where English speakers struggle most with French, so every word has audio and every session ends with shadowing a dialogue.`, "NSF-funded study, 2023", "https://par.nsf.gov/biblio/10620812"],
    ["Grow your input over time", `Comfortable reading needs you to know about 98% of the words on the page, so word lists alone won't get you there. From Phase 3 the plan adds daily listening and reading, and you can add words you meet to « Mes mots ».`, "French subtitle frequency analysis", "https://www.mindomax.com/common-french-words"]
  ];
  const parts = [["review", "Review cards that are due, oldest first. French→English for young cards, English→French (typed) once you know them."], ["learn", `Meet ${S.prefs.newPerDay} new words or phrases with audio, then two quick quiz rounds.`], ["pattern", "One short grammar idea from the current unit, then practice questions. Pass 75% to move on. Later sessions mix in older rules."], ["listen", "A short dialogue: listen without text, read along, shadow it, then type one sentence from dictation."]];
  return `<div class="stack" style="gap:28px">

  <section><h2>The four phases</h2><div class="phase-list" style="margin-top:12px">${PHASES.map(p => `<div class="card phase-card"><p class="lvl">Phase ${p.n} · ${esc(p.level)}</p><h3>${esc(p.name)} <span class="muted" style="font-weight:500">· ${esc(p.en)}</span></h3><p class="muted" style="margin-top:6px">${esc(p.goal)}</p><ul>${p.units.map(u => `<li>${u.code} ${esc(u.title)}</li>`).join("")}</ul><p class="daily"><b>Daily time:</b> ${esc(p.daily)}</p></div>`).join("")}</div></section>
  <section class="card"><h2>A realistic timeline</h2>
    <p class="muted" style="margin-top:8px;max-width:62ch">French is one of the quicker languages for English speakers, but it's still hundreds of hours. Fifteen minutes a day adds up to about 90 hours a year: enough for a solid A1 base and a lasting habit. Adding listening and reading in Phases 3–4 is what carries you toward B1.</p>
    <div class="tbl"><table class="htable"><tr><th>Level</th><th>What you can do</th><th>Approx. hours</th></tr>
    <tr><td><b>A1</b></td><td>Introduce yourself, order, ask simple questions</td><td class="num">60–100</td></tr>
    <tr><td><b>B1</b></td><td>Hold everyday conversations, follow clear speech on familiar topics</td><td class="num">350–400</td></tr>
    <tr><td><b>B2 / C1</b></td><td>Professional working proficiency (US Foreign Service Institute estimate)</td><td class="num">600–750</td></tr></table></div></section>
  <section><h3>Sources</h3><ol class="srcs">
    <li><a href="https://www.gwern.net/doc/psychology/spaced-repetition/1981-bloom.pdf" target="_blank" rel="noopener">Bloom & Shuell (1981), massed vs distributed practice of French vocabulary</a></li>

    <li><a href="https://escholarship.org/uc/item/61p4p686" target="_blank" rel="noopener">Balancing spacing and repetition under time constraints (2025)</a></li>

const ACT = {
  start: () => startSession("daily"),
  xreview: () => startSession("review"),
  xnew: () => startSession("new"),
  next: () => { if (TTS.ok) speechSynthesis.cancel(); nextStep(); },
  say: b => TTS.say(b.dataset.t),
  acc: b => { const el = document.getElementById(b.dataset.for); if (!el) return; const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? s; el.value = el.value.slice(0, s) + b.dataset.c + el.value.slice(e); el.focus(); el.setSelectionRange(s + 1, s + 1); },
  show: () => { const R = SESS.rv; R.shown = true; const it = itemById(R.q[0]); if (S.cards[R.q[0]].reps >= 2) TTS.say(it.fr); render(); },
  check: () => { const R = SESS.rv, it = itemById(R.q[0]), v = ($("#ans") || {}).value || ""; R.checked = checkAnswer(v, it.fr); R.shown = true; TTS.say(it.fr); render(); },
  rate: b => {
    const r = +b.dataset.r, R = SESS.rv, id = R.q.shift(), c = S.cards[id];
    if (R.relearn[id]) { if (r === 1) R.q.splice(Math.min(3, R.q.length), 0, id); else delete R.relearn[id]; }
    else {
      const n = nextState(c, r);
      if (n.ivl > 4) { n.ivl = Math.max(1, Math.round(n.ivl * (0.95 + Math.random() * 0.1))); n.due = TODAY() + n.ivl; }
      S.cards[id] = n; SESS.stats.r++; L().r++;
      if (r === 1) { R.relearn[id] = true; R.q.splice(Math.min(3, R.q.length), 0, id); }
    }
    R.shown = false; R.checked = null; R.input = ""; save();
    if (!R.q.length) nextStep(); else render();
  },
  lnext: () => { const N = SESS.ln; N.i++; if (N.i >= N.ids.length) beginQuiz(); else render(); },
  known: () => {
    const N = SESS.ln, id = N.ids[N.i];
    S.cards[id] = { due: TODAY() + 4, ivl: 4, ease: 2.6, reps: 2, lapses: 0, seen: todayKey() }; L().n++; SESS.stats.n++;
    N.ids.splice(N.i, 1); N.knownCount = (N.knownCount || 0) + 1; save();
    if (N.i >= N.ids.length) beginQuiz(); else render();
  },
  opt: b => {
    const N = SESS.ln; if (N.stage !== "quiz" || N.ans) return;
    const t = N.tasks[0], it = itemById(t.id), k = +b.dataset.k - 1, right = t.k === "recog" ? it.en : it.fr, ok = t.opts[k] === right;
    N.ans = { k, ok };
    if (t.k === "prod") TTS.say(it.fr);
    if (!ok) N.tasks.push(Object.assign({}, t, { opts: shuffle(t.opts) }));
    render();
    if (ok) { const tok = ++N.tok; setTimeout(() => { if (SESS && SESS.ln === N && N.tok === tok && N.ans) ACT.qnext(); }, 750); }
  },
  qnext: () => { const N = SESS.ln; N.tasks.shift(); N.ans = null; N.tok++; if (!N.tasks.length) finishLearn(); else render(); },
  pstart: () => { SESS.pt.stage = "drill"; render(); },
  popt: b => { const P = SESS.pt; if (P.ans) return; const d = P.drills[P.i], k = +b.dataset.k - 1, ok = d.opts[k] === d.correct; P.ans = { k, ok }; if (ok) P.score++; render(); },
  pnext: () => {
    const P = SESS.pt; P.i++; P.ans = null;
    if (P.i >= P.drills.length) {
      P.stage = "result";
      if (!P.refresh && P.score / P.drills.length >= 0.75) { S.prog.passed[UNITS[P.u].id] = true; checkAdvance(); save(); }
    }
    render();
  },
  pretry: () => { const P = SESS.pt; P.drills = shuffle(P.drills).map(d => Object.assign({}, d, { opts: shuffle(d.opts) })); P.i = 0; P.score = 0; P.ans = null; P.stage = "lesson"; render(); },
  lplay: () => { const Q = SESS.ls; TTS.seq(UNITS[Q.u].lines.map(l => l[0]), { rate: Q.slow ? 0.7 : S.prefs.rate }); },
  lline: b => { const Q = SESS.ls; TTS.say(UNITS[Q.u].lines[+b.dataset.i][0], { rate: Q.slow ? 0.7 : S.prefs.rate }); },
  lfr: () => { SESS.ls.fr = !SESS.ls.fr; render(); },
  len: () => { SESS.ls.en = !SESS.ls.en; render(); },
  lslow: () => { SESS.ls.slow = !SESS.ls.slow; render(); },
  lother: () => { const max = Math.min(S.prog.unit, UNITS.length - 1); const opts = UNITS.slice(0, max + 1).map(u => u.idx).filter(i => i !== SESS.ls.u); setListen(opts.length ? pick(opts) : SESS.ls.u); render(); },
  dplay: () => { const Q = SESS.ls; TTS.say(UNITS[Q.u].lines[Q.d][0]); },
  dslow: () => { const Q = SESS.ls; TTS.say(UNITS[Q.u].lines[Q.d][0], { rate: 0.65 }); },
  dcheck: () => { const Q = SESS.ls, v = ($("#dict") || {}).value || ""; if (!v.trim()) { toast("Play the sentence, then type what you hear."); return; } Q.dRes = wordDiff(UNITS[Q.u].lines[Q.d][0], v); Q.dIn = v; render(); },
  lmic: b => {
    if (!SR) return; const Q = SESS.ls, i = +b.dataset.i, line = UNITS[Q.u].lines[i][0];
    let rec; try { rec = new SR(); } catch (e) { toast("The microphone isn't available here."); return; }
    rec.lang = "fr-FR"; rec.maxAlternatives = 3; rec.interimResults = false;
    b.classList.add("rec");
    rec.onresult = e => { const alts = Array.from(e.results[0]).map(a => a.transcript); const best = Math.max(...alts.map(a => similarity(norm(a, true), norm(line, true)))); Q.mic[i] = { p: Math.round(best * 100), heard: alts[0] }; render(); };
    rec.onerror = e => { b.classList.remove("rec"); toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone access is blocked. Allow it in your browser to use this." : e.error === "no-speech" ? "Didn't hear anything. Tap the mic and speak." : "Couldn't check that. Try again."); };
    rec.onend = () => b.classList.remove("rec");
    try { rec.start(); } catch (e) { b.classList.remove("rec"); toast("The microphone isn't available here."); }
  },
  logx: b => { L().x = (L().x || 0) + (+b.dataset.m); save(); toast(`Logged ${b.dataset.m} minutes of practice.`); render(); },
  addw: () => {
    const fr = $("#cfr").value.trim(), en = $("#cen").value.trim(), note = $("#cnote").value.trim();
    if (!fr || !en) { toast("Add both the French and the English."); return; }
    S.custom.push({ id: "c" + Date.now().toString(36), fr, en, note }); save(); toast("Added. It will appear in your next new words."); render();
    const box = $("#addbox"); if (box) box.open = true; const f = $("#cfr"); if (f) f.focus();
  },
  delw: b => { const id = b.dataset.id; if (delArm !== id) { delArm = id; render(); return; } S.custom = S.custom.filter(c => c.id !== id); delete S.cards[id]; delArm = null; save(); render(); },
  exdl: () => {
    try { const blob = new Blob([JSON.stringify(S)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "carnet-backup-" + todayKey() + ".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Backup downloaded."); }
    catch (e) { toast("Download isn't available here. Use Copy backup text."); }
  },
  excp: () => {
    const txt = JSON.stringify(S), ta = $("#imp");
    const fallback = () => { if (ta) { ta.value = txt; ta.focus(); ta.select(); } toast("Select the text in the box and copy it."); };
    try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied. Paste it somewhere safe."), fallback); } catch (e) { fallback(); }
  },
  imp: () => importText(($("#imp") || {}).value || ""),
  reset: () => { if (!resetArm) { resetArm = true; render(); return; } resetArm = false; S = defaults(); SESS = null; save(); toast("Progress erased."); render(); },
  unreset: () => { resetArm = false; render(); }
};
function beginQuiz() {
  const N = SESS.ln;
  if (!N.ids.length) { save(); return nextStep(); }
  const mk = (id, k) => {
    const it = itemById(id), f = k === "recog" ? "en" : "fr";
    let pool = (it.unit ? it.unit.items : []).concat(Object.keys(S.cards).map(itemById).filter(Boolean), UNITS[0].items, UNITS[1].items);
    pool = [...new Set(pool.filter(x => x.id !== id).map(x => x[f]))].filter(v => v !== it[f]);
    return { id, k, opts: shuffle([it[f]].concat(shuffle(pool).slice(0, 3))) };
  };
  N.tasks = shuffle(N.ids.map(id => mk(id, "recog"))).concat(shuffle(N.ids.map(id => mk(id, "prod"))));
  N.stage = "quiz"; render();
}
function finishLearn() {
  const N = SESS.ln;
  N.ids.forEach(id => { S.cards[id] = newCard(); });
  L().n += N.ids.length; SESS.stats.n += N.ids.length;
  checkAdvance(); save();
  N.stage = "done"; render();
}
function importText(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast("That doesn't look like a Carnet backup."); return; }
  if (!d || typeof d !== "object" || !d.cards || !d.prefs) { toast("That doesn't look like a Carnet backup."); return; }
  const def = defaults(); S = Object.assign(def, d, { prefs: Object.assign(def.prefs, d.prefs), prog: Object.assign(def.prog, d.prog || {}) });
  SESS = null; save(); TTS.load(); toast("Progress restored."); render();
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const pi = e.target.closest(".prose i"); if (pi) { TTS.say(pi.textContent); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.matches("[data-filter]")) {
    const q = el.value.trim().toLowerCase(), qn = norm(q, true);
    document.querySelectorAll("[data-sec]").forEach(sec => {
      let any = false;
      sec.querySelectorAll("li[data-s]").forEach(li => { const s = li.dataset.s, hit = !q || s.includes(q) || norm(s, true).includes(qn); li.hidden = !hit; any = any || hit; });
      sec.hidden = !any;
    });
  }
  if (el.id === "dict" && SESS && SESS.ls) SESS.ls.dIn = el.value;
  if (el.id === "ans" && SESS && SESS.rv) SESS.rv.input = el.value;
  if (el.dataset.pref === "newPerDay") { $("#pnewv").textContent = el.value; S.prefs.newPerDay = +el.value; save(); }
  if (el.dataset.pref === "rate") { $("#pratev").textContent = (+el.value).toFixed(2) + "×"; S.prefs.rate = +el.value; save(); }
});
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset.pref;
  if (el.id === "impf" && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => importText(String(r.result)); r.readAsText(el.files[0]); el.value = ""; return; }
  if (!k) return;
  if (k === "minutes") S.prefs.minutes = +el.value;
  if (k === "typing" || k === "autoplay") S.prefs[k] = el.checked;
  if (k === "voice") { S.prefs.voice = el.value; TTS.load(); TTS.say("Bonjour !"); }
  save();
});
document.addEventListener("keydown", e => {
  if (cur !== "session" || !SESS || SESS.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName, inField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (e.key === "Enter") { const btn = $("[data-enter]"); if (btn && (inField || tag !== "BUTTON" || btn === e.target)) { e.preventDefault(); btn.click(); } return; }
  if (inField) return;
  if (e.key === " ") { const btn = $("[data-enter]"); if (btn) { e.preventDefault(); btn.click(); } return; }
  if (/^[1-4]$/.test(e.key)) { const btn = $(`[data-act="rate"][data-r="${e.key}"], [data-act="opt"][data-k="${e.key}"]:not(:disabled), [data-act="popt"][data-k="${e.key}"]:not(:disabled)`); if (btn) { e.preventDefault(); btn.click(); } }
});
window.addEventListener("hashchange", route);

/* ================= timer ================= */
function updateTimer() {
  const t = $("#tmr"), bar = $("#tbar"); if (!t || !SESS) return;
  t.textContent = fmtMin(SESS.secs);
  if (bar) bar.style.width = Math.min(100, SESS.secs / (S.prefs.minutes * 60) * 100) + "%";
}
setInterval(() => {
  if (!SESS || SESS.done || cur !== "session" || document.hidden) return;
  SESS.secs++; SESS.stepSecs++; L().m = (L().m || 0) + 1;
  updateTimer();
  if (SESS.secs % 10 === 0) save();
  const s = SESS.steps[SESS.step];
  const ae = document.activeElement, typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if (SESS.kind === "daily" && SESS.stepSecs === budget(s) * 60 + 1 && !$(".over") && !typing && s !== "learn") render();
}, 1000);

route();
</script>
</body>
